# ─────────────────────────────────────────────────────────────────────────────
# BazionWeb — Render Blueprint (no-VPS hosting)
#
# Deploys web (Next.js standalone Docker) + api (NestJS Docker) to Render's
# free tier, backed by Neon Postgres (permanent free tier — no card).
#
# Why Neon instead of Render Postgres? Render's free database expires 30 days
# after creation, has no backups and no pooling (docs: render.com/docs/free).
# Neon's free plan is permanent: 0.5 GB storage, 100 CU-hours/month,
# scale-to-zero after 5 min idle, built-in PgBouncer pooling.
#
# Setup:
#   1. Create a free project at console.neon.tech. In the dashboard click
#      Connect and copy TWO strings for the same branch/database/role:
#        - pooled (hostname contains "-pooler")  → DATABASE_URL
#        - direct (pooling disabled)              → DATABASE_URL_UNPOOLED
#      (Prisma Migrate cannot run through the pooler, hence directUrl.)
#   2. Render Dashboard → New → Blueprint → select this repo (render.yaml at
#      root). Paste the two URLs when prompted, plus the other secrets.
#   3. After the first deploy, copy the real api .onrender.com URL into
#      the web service's NEXT_PUBLIC_API_URL (Render rebuilds automatically —
#      NEXT_PUBLIC_* values are inlined at build time).
#   4. Add repo secrets DATABASE_URL (+ DATABASE_URL_UNPOOLED) with the same
#      Neon strings so CI runs Prisma migrations on every push to
#      staging/main.
#   5. Disconnect/pause the Cloudflare Pages project for this repo — Pages
#      cannot host a standalone Next.js server (25 MiB file limit, no Node
#      server). The web service here replaces it.
#
# Notes:
#   - Render injects PORT at runtime; both Docker images respect it
#     (Next standalone server.js and NestJS ConfigService PORT).
#   - Render also injects every envVar as a Docker build arg, so
#     NEXT_PUBLIC_* reach `next build` without extra configuration.
#   - The API has no Redis dependency in code; Postgres is the only
#     backing service required.
#   - Login/portal need Keycloak (KEYCLOAK_*); public pages, /api/health
#     and non-auth endpoints work without it.
#   - Free web services sleep after ~15 min idle (~1 min wake). The
#     keep-awake workflow pings them during business hours to stay inside
#     the 750 free-instance-hours/month quota. Upgrade web/api to Starter
#     to keep them always on + custom domains.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Next.js Web App ──────────────────────────────────────────────────────
  - type: web
    name: bazionweb-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/web/Dockerfile
    # NOTE: dockerContext intentionally omitted — Render resolves the Dockerfile
    # relative to the context when both are set (apps/web + apps/web/Dockerfile
    # breaks). Default context = the Dockerfile's own directory (apps/web).
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Production value (custom domain verified in Render + Cloudflare DNS).
      - key: NEXT_PUBLIC_API_URL
        value: https://api.bazionweb.com/api/v1
      # Production value (custom domain verified in Render + Cloudflare DNS).
      - key: NEXT_PUBLIC_APP_URL
        value: https://bazionweb.com
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false

  # ── NestJS API ───────────────────────────────────────────────────────────
  - type: web
    name: bazionweb-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    # NOTE: dockerContext intentionally omitted — see web service above.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # local = built-in credentials auth (default). Set to `keycloak` only
      # if you host Keycloak and provide KEYCLOAK_URL/REALM/CLIENT_ID/SECRET.
      - key: AUTH_PROVIDER
        value: local
      # Seed/snippet: sets the admin@bazionweb.com password on deploy.
      - key: ADMIN_PASSWORD
        sync: false
      # Neon pooled connection string (hostname contains "-pooler").
      # Runtime queries go through PgBouncer; prompt at Blueprint creation.
      - key: DATABASE_URL
        sync: false
      # Neon direct connection string (pooling disabled) for Prisma Migrate.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: RATE_LIMIT_TTL
        value: "60"
      - key: RATE_LIMIT_MAX
        value: "100"
      # Auth provider (Keycloak) — required for portal/admin login.
      # Leave empty for now; public endpoints and health checks work without it.
      - key: KEYCLOAK_URL
        sync: false
      - key: KEYCLOAK_REALM
        sync: false
      - key: KEYCLOAK_CLIENT_ID
        sync: false
      - key: KEYCLOAK_CLIENT_SECRET
        sync: false
      # Email (SMTP) — optional until notifications are needed
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Object storage + billing — optional until those features are used
      - key: BACKBLAZE_BUCKET
        sync: false
      - key: BACKBLAZE_KEY_ID
        sync: false
      - key: BACKBLAZE_APP_KEY
        sync: false
      - key: INTASEND_PUBLISHABLE_KEY
        sync: false
      - key: INTASEND_SECRET_KEY
        sync: false
      - key: WISE_API_TOKEN
        sync: false
