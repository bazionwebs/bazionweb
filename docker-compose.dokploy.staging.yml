name: bazionweb-staging

x-logging: &staging-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-node-security: &node-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

networks:
  staging-app:
    internal: true
  staging-data:
    internal: true
  staging-cache:
    internal: true
  dokploy-network:
    external: true

volumes:
  bazionweb_staging_pgdata:
  bazionweb_staging_redis:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      com.bazion.backup-target: bazionweb-staging
    environment:
      POSTGRES_DB: bazionweb_staging
      POSTGRES_USER: bazion_admin
      POSTGRES_PASSWORD: ${BAZION_DB_ADMIN_PASSWORD:?Set a unique staging PostgreSQL admin password}
      BAZIONWEB_MIGRATOR_PASSWORD: ${BAZIONWEB_MIGRATOR_PASSWORD:?Set the staging migration-role password}
      BAZIONWEB_APP_PASSWORD: ${BAZIONWEB_APP_PASSWORD:?Set the staging API-role password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - bazionweb_staging_pgdata:/var/lib/postgresql/data
      - ./deploy/dokploy/bazionweb-staging-db-init.sql:/docker-entrypoint-initdb.d/10-bazionweb-staging-roles.sql:ro
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazion_admin -d bazionweb_staging"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
    logging: *staging-logging
    networks:
      - staging-data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set a unique staging Redis password}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set a unique staging Redis password}
    volumes:
      - bazionweb_staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 192M
    logging: *staging-logging
    networks:
      - staging-cache

  migrate:
    image: ghcr.io/bazionwebs/bazionweb-api:${IMAGE_TAG:?Set IMAGE_TAG to staging or a published sha tag}
    pull_policy: always
    restart: "no"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema=./prisma/schema.prisma"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${BAZIONWEB_MIGRATOR_DATABASE_URL:?Set the direct migrator connection string}
      DATABASE_URL_UNPOOLED: ${BAZIONWEB_MIGRATOR_DATABASE_URL:?Set the direct migrator connection string}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
    logging: *staging-logging
    networks:
      - staging-data

  api:
    image: ghcr.io/bazionwebs/bazionweb-api:${IMAGE_TAG:?Set IMAGE_TAG to staging or a published sha tag}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: ${BAZIONWEB_APP_DATABASE_URL:?Set the least-privilege API database URL}
      DATABASE_URL_UNPOOLED: ${BAZIONWEB_APP_DATABASE_URL:?Set the least-privilege API database URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set a unique staging Redis password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a random staging-only secret of at least 32 characters}
      INTERNAL_DISPATCH_SECRET: ${INTERNAL_DISPATCH_SECRET:?Set a unique staging-only secret of at least 32 characters}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-}
      FRONTEND_URL: https://staging.bazionweb.com
      TRUST_PROXY: "2"
      AUTH_PROVIDER: local
      PLATFORM_PROVISIONING_WORKER_ENABLED: "false"
      PLATFORM_API_BASE_URL: ${PLATFORM_API_BASE_URL:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      PAYSTACK_SETTLEMENT_CURRENCY: KES
      DARAJA_ENVIRONMENT: sandbox
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-}
      DARAJA_BUSINESS_SHORTCODE: ${DARAJA_BUSINESS_SHORTCODE:-174379}
      DARAJA_PASSKEY: ${DARAJA_PASSKEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.55"
          memory: 768M
    logging: *staging-logging
    <<: *node-security
    networks:
      - staging-app
      - staging-data
      - staging-cache
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.bazionweb-staging-api.rule=Host(`staging.bazionweb.com`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.bazionweb-staging-api.entrypoints=websecure"
      - "traefik.http.routers.bazionweb-staging-api.tls=true"
      - "traefik.http.routers.bazionweb-staging-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bazionweb-staging-api.priority=1000"
      - "traefik.http.routers.bazionweb-staging-api.middlewares=bazionweb-staging-api-rate,bazionweb-staging-sec-headers,bazionweb-staging-compress"
      - "traefik.http.routers.bazionweb-staging-api.service=bazionweb-staging-api"
      - "traefik.http.services.bazionweb-staging-api.loadbalancer.server.port=4000"
      - "traefik.http.routers.bazionweb-staging-api-host.rule=Host(`staging-api.bazionweb.com`)"
      - "traefik.http.routers.bazionweb-staging-api-host.entrypoints=websecure"
      - "traefik.http.routers.bazionweb-staging-api-host.tls=true"
      - "traefik.http.routers.bazionweb-staging-api-host.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bazionweb-staging-api-host.middlewares=bazionweb-staging-api-rate,bazionweb-staging-sec-headers,bazionweb-staging-compress"
      - "traefik.http.routers.bazionweb-staging-api-host.service=bazionweb-staging-api"
      - "traefik.http.middlewares.bazionweb-staging-api-rate.ratelimit.average=60"
      - "traefik.http.middlewares.bazionweb-staging-api-rate.ratelimit.burst=120"
      - "traefik.http.middlewares.bazionweb-staging-sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.bazionweb-staging-sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.bazionweb-staging-sec-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.bazionweb-staging-sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.bazionweb-staging-sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.bazionweb-staging-sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.bazionweb-staging-compress.compress=true"

  web:
    image: ghcr.io/bazionwebs/bazionweb-web:${IMAGE_TAG:?Set IMAGE_TAG to staging or a published sha tag}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      INTERNAL_DISPATCH_SECRET: ${INTERNAL_DISPATCH_SECRET:?Set the same staging-only API dispatch secret}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 512M
    logging: *staging-logging
    <<: *node-security
    networks:
      - staging-app
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.bazionweb-staging-web.rule=Host(`staging.bazionweb.com`)"
      - "traefik.http.routers.bazionweb-staging-web.entrypoints=websecure"
      - "traefik.http.routers.bazionweb-staging-web.tls=true"
      - "traefik.http.routers.bazionweb-staging-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bazionweb-staging-web.middlewares=bazionweb-staging-sec-headers,bazionweb-staging-compress"
      - "traefik.http.services.bazionweb-staging-web.loadbalancer.server.port=3000"