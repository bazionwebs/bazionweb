name: CI/CD Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# BazionWeb CI/CD Pipeline
# Aligned with: MPD v2.0, Section 10.2 (9 pipeline stages)
# Stages: Lint → Unit Tests → Build → Security Scan → Staging Deploy →
#         E2E Tests → Lighthouse CI → Production Deploy (manual gate) →
#         Post-Deploy Verification
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [develop, staging, main]
    # Docs/CI-only edits don't touch the app — don't burn deploy quota on them.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
  pull_request:
    branches: [develop, staging, main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/bazionweb-web
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/bazionweb-api
  NODE_VERSION: "22"

jobs:
  # ─── Stage 0: Change detection ──────────────────────────────────────────────
  # Skips the expensive stages (Docker builds, Trivy, migrations) when only
  # docs or CI config changed. Vercel still auto-deploys the web app on every
  # push — prefix a docs-only commit title with "[skip deploy]" to skip that.
  changes:
    name: "Stage 0 — Detect changed apps"
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'prisma/**'
              - 'e2e/**'
              - 'infrastructure/**'
              - 'package.json'
              - 'package-lock.json'

  # ─── Stage 1: Lint & Type-check ─────────────────────────────────────────────
  lint:
    name: "Stage 1 — Lint & Type-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend deps
        run: |
          cd apps/web
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint frontend
        run: npm run lint --prefix apps/web

      - name: TypeScript check (frontend)
        run: npm run tsc --prefix apps/web

      - name: Install API deps
        run: |
          cd apps/api
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run prisma:generate

      - name: Lint API
        run: npm run lint --prefix apps/api

      - name: TypeScript check (API)
        run: npm run tsc --prefix apps/api

  # ─── Stage 2: Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: "Stage 2 — Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bazionweb_test
          POSTGRES_USER: bazionweb
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & run frontend tests
        run: |
          cd apps/web
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test -- --coverage --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

      - name: Install & run API tests
        run: |
          cd apps/api
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run prisma:generate
          npm run test:cov -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://bazionweb:testpassword@localhost:5432/bazionweb_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-minimum-32-characters
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─── Stage 3: Build Docker Images ───────────────────────────────────────────
  build:
    name: "Stage 3 — Build & Push Images"
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.WEB_IMAGE }}
            ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.version }},${{ env.WEB_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.meta.outputs.version }},${{ env.API_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 4: Security Scan ─────────────────────────────────────────────────
  security-scan:
    name: "Stage 4 — Security Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy on web image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "${{ env.WEB_IMAGE }}:${{ github.ref_name }}"
          format: "sarif"
          output: "trivy-web.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "${{ env.API_IMAGE }}:${{ github.ref_name }}"
          format: "sarif"
          output: "trivy-api.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy web report (artifact)
        if: always() && hashFiles('trivy-web.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-web-sarif
          path: trivy-web.sarif
          retention-days: 30

      - name: Upload Trivy API report (artifact)
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-api-sarif
          path: trivy-api.sarif
          retention-days: 30

      - name: Upload Trivy web SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-web.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "trivy-web.sarif"
          category: "trivy-web"

      - name: Upload Trivy API SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-api.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "trivy-api.sarif"
          category: "trivy-api"

      - name: npm audit (frontend, informational)
        run: |
          cd apps/web
          npm audit --omit=dev --audit-level=high || true

      - name: npm audit (API, informational)
        run: |
          cd apps/api
          if [ -f package-lock.json ]; then npm audit --omit=dev --audit-level=high || true; else echo "No lockfile — skipping audit"; fi

  # ─── Stage 4b: Database Migrations (Neon Postgres) ────────────────────────────
  # Runs Prisma migrations from CI because the API's production image excludes
  # the Prisma CLI. Needs repo secrets: DATABASE_URL (Neon pooled string) and
  # DATABASE_URL_UNPOOLED (Neon direct string — migrate can't run through the
  # pooler). Skips gracefully until DATABASE_URL is set.
  migrate:
    name: "Stage 4b — Prisma Migrate (Neon)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Prisma migrations
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — skipping migrations (set it to the Neon pooled connection string)"
            exit 0
          fi
          cd apps/api
          npm ci
          npm run prisma:generate
          npm run prisma:migrate
          npm run prisma:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  # ─── Stage 5: Deploy to Staging ─────────────────────────────────────────────
  deploy-staging:
    name: "Stage 5 — Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [build, security-scan, migrate]
    if: github.ref == 'refs/heads/staging'
    environment: staging
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}

    steps:
      - uses: actions/checkout@v4

      # Cloud Run replaced Render (suspended free tier). Builds from source via
      # Cloud Build, so no private-ghcr pull secret is needed on the service.
      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy API to Cloud Run (staging)
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: bazionweb-api-staging
          source: apps/api
          dockerfile: Dockerfile
          flags: '--allow-unauthenticated --cpu 1 --memory 512Mi --max-instances 2 --timeout 300s'
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND_URL=${{ vars.STAGING_FRONTEND_URL || 'https://staging.bazionweb.com' }}

      - name: Cloud Run not configured (skipping)
        if: env.GCP_SA_KEY == '' || env.GCP_PROJECT_ID == ''
        run: echo "GCP_SA_KEY/GCP_PROJECT_ID secrets not set — skipping Cloud Run deploy (set them once to enable)."

  # ─── Stage 6: E2E Tests (Staging) ───────────────────────────────────────────
  e2e-tests:
    name: "Stage 6 — E2E Tests (Playwright)"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          if [ -d e2e ]; then
            cd e2e
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npx playwright install --with-deps chromium
          else
            echo "No e2e directory — skipping"
          fi

      - name: Run E2E tests
        if: ${{ hashFiles('e2e/package.json') != '' }}
        run: npm test --prefix e2e
        env:
          BASE_URL: https://staging.bazionweb.com
          PORTAL_TEST_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          PORTAL_TEST_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  # ─── Stage 7: Lighthouse CI ─────────────────────────────────────────────────
  lighthouse:
    name: "Stage 7 — Lighthouse CI"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://staging.bazionweb.com
            https://staging.bazionweb.com/services
            https://staging.bazionweb.com/pricing
          configPath: ".lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ─── Stage 8: Deploy to Production (manual gate) ────────────────────────────
  deploy-production:
    name: "Stage 8 — Deploy to Production"
    runs-on: ubuntu-latest
    needs: [security-scan, migrate]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://bazionweb.com
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      API_URL: ${{ secrets.API_URL }}

    steps:
      # Web app deploys to Vercel automatically via the GitHub integration.
      # The API deploys to Cloud Run here (Render is retired).
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy API to Cloud Run (production)
        id: deploy-cloudrun
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: bazionweb-api
          source: apps/api
          dockerfile: Dockerfile
          flags: '--allow-unauthenticated --cpu 1 --memory 512Mi --max-instances 5 --timeout 300s'
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND_URL=${{ vars.PRODUCTION_FRONTEND_URL || 'https://bazionweb.com' }}

      - name: Cloud Run not configured (skipping)
        if: env.GCP_SA_KEY == '' || env.GCP_PROJECT_ID == ''
        run: echo "GCP_SA_KEY/GCP_PROJECT_ID secrets not set — skipping Cloud Run deploy (set them once to enable)."

      - name: Health check gate
        if: (env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != '') || env.API_URL != ''
        run: |
          ACTIVE_API_URL="${API_URL:-${{ steps.deploy-cloudrun.outputs.url }}}"
          ACTIVE_API_URL="${ACTIVE_API_URL:-https://bazionweb.com}"
          FALLBACK_API_URL="https://bazionweb.vercel.app"
          for i in 1 2 3 4 5 6; do
            # Probe primary origin with --location to follow redirects (e.g. 308 apex -> www)
            STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" "$ACTIVE_API_URL/api/v1/health" || true)
            if [ "$STATUS" != "200" ]; then
              STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" "$ACTIVE_API_URL/api/health" || true)
            fi
            if [ "$STATUS" = "200" ]; then
              echo "API healthy at $ACTIVE_API_URL"
              exit 0
            fi

            # Fallback probe if primary didn't succeed
            if [ "$ACTIVE_API_URL" != "$FALLBACK_API_URL" ]; then
              echo "Status $STATUS from $ACTIVE_API_URL — probing fallback origin $FALLBACK_API_URL…"
              FALLBACK_STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" "$FALLBACK_API_URL/api/v1/health" || true)
              if [ "$FALLBACK_STATUS" != "200" ]; then
                FALLBACK_STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" "$FALLBACK_API_URL/api/health" || true)
              fi
              if [ "$FALLBACK_STATUS" = "200" ]; then
                echo "API healthy at $FALLBACK_API_URL"
                exit 0
              fi
            fi

            echo "Waiting for API to become healthy… ($i/6)"
            sleep 20
          done
          echo "API health check failed at $ACTIVE_API_URL and $FALLBACK_API_URL"
          exit 1
        env:
          API_URL: ${{ secrets.API_URL }}

  # ─── Stage 9: Post-Deploy Verification ──────────────────────────────────────
  post-deploy-verify:
    name: "Stage 9 — Post-Deploy Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      API_URL: ${{ secrets.API_URL }}

    steps:
      - name: Smoke tests — homepage
        run: |
          curl --fail --silent --location https://bazionweb.vercel.app | grep -q "BazionWeb" \
            || (echo "Homepage smoke test failed" && exit 1)

      - name: Smoke tests — API health
        if: (env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != '') || env.API_URL != ''
        run: |
          STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" "${API_URL:-https://bazionweb.com}/api/v1/health" || true)
          if [ "$STATUS" != "200" ]; then
            STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" "${API_URL:-https://bazionweb.com}/api/health" || true)
          fi
          if [ "$STATUS" != "200" ]; then
            STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" https://bazionweb.vercel.app/api/v1/health || true)
          fi
          if [ "$STATUS" != "200" ]; then
            STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" https://bazionweb.vercel.app/api/health || true)
          fi
          [ "$STATUS" = "200" ] || (echo "API health check failed: $STATUS" && exit 1)
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Smoke tests — SSL valid
        run: |
          TARGET_HOST="bazionweb.com"
          if ! echo | openssl s_client -connect "${TARGET_HOST}:443" -servername "${TARGET_HOST}" 2>/dev/null | grep -q "BEGIN CERTIFICATE"; then
            TARGET_HOST="bazionweb.vercel.app"
          fi
          echo | openssl s_client -connect "${TARGET_HOST}:443" -servername "${TARGET_HOST}" 2>/dev/null \
            | openssl x509 -noout -checkend 2592000 \
            || (echo "SSL cert expires within 30 days!" && exit 1)

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "✅ BazionWeb production deploy successful — ${{ github.sha }} by ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "🚨 BazionWeb post-deploy verification FAILED — ${{ github.sha }} — immediate rollback required"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
