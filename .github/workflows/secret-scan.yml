name: Secret Scan (gitleaks)

on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main, staging]
  schedule:
    - cron: "0 7 * * 1" # Weekly Monday sweep of full history
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks — staged + full-history secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so scheduled scans sweep every commit, not just HEAD.
          fetch-depth: 0

      - name: gitleaks detect (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
