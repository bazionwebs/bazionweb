<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792">
  <!-- Background -->
  <rect width="612" height="792" fill="#f5f0eb"/>
  
  <!-- Outer decorative border (Kente/Maasai style) -->
  <rect x="20" y="20" width="572" height="752" fill="none" stroke="#8B0000" stroke-width="4"/>
  <rect x="30" y="30" width="552" height="732" fill="none" stroke="#DAA520" stroke-width="2"/>
  
  <!-- Top decorative bands -->
  <rect x="40" y="40" width="532" height="20" fill="#8B0000" rx="2"/>
  <rect x="40" y="65" width="532" height="10" fill="#DAA520" rx="1"/>
  
  <!-- Title -->
  <text x="306" y="180" font-family="Georgia, serif" font-size="28" fill="#333" text-anchor="middle" font-style="italic">In Loving Memory</text>
  <text x="306" y="220" font-family="Georgia, serif" font-size="14" fill="#666" text-anchor="middle">OF</text>
  
  <!-- Deceased full name -->
  <text x="306" y="280" font-family="Georgia, serif" font-size="36" fill="#1a1a1a" text-anchor="middle" font-weight="bold">[Full Name]</text>
  
  <!-- Birth and passing dates -->
  <text x="306" y="330" font-family="Georgia, serif" font-size="18" fill="#555" text-anchor="middle">[Date of Birth] — [Date of Passing]</text>
  
  <!-- Photo placeholder -->
  <rect x="206" y="370" width="200" height="220" fill="#ddd" stroke="#999" stroke-width="1" rx="4"/>
  <text x="306" y="490" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">[Photo]</text>
  
  <!-- Scripture or quote -->
  <text x="306" y="640" font-family="Georgia, serif" font-size="14" fill="#666" text-anchor="middle" font-style="italic">“[Scripture or Quote]”</text>
  
  <!-- Bottom decorative bands -->
  <rect x="40" y="700" width="532" height="10" fill="#DAA520" rx="1"/>
  <rect x="40" y="715" width="532" height="20" fill="#8B0000" rx="2"/>
  
  <!-- Service details -->
  <text x="306" y="760" font-family="Arial, sans-serif" font-size="11" fill="#777" text-anchor="middle">[Date] · [Time] · [Venue]</text>
</svg>