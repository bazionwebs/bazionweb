groups:

  # ── Uptime alerts ───────────────────────────────────────────────────────────
  - name: uptime
    rules:
      - alert: SiteDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Site {{ $labels.instance }} is DOWN"
          description: "{{ $labels.instance }} has been unreachable for more than 2 minutes. P1 incident — immediate response required."
          runbook: "https://docs.bazionweb.com/runbooks/site-down"

      - alert: HighLatency
        expr: probe_http_duration_seconds{job="blackbox-http"} > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time on {{ $labels.instance }}"
          description: "{{ $labels.instance }} response time is {{ $value }}s (threshold: 3s)"

  # ── SSL alerts ──────────────────────────────────────────────────────────────
  - name: ssl
    rules:
      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon: {{ $labels.instance }}"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}. Auto-renewal should have triggered."

      - alert: SSLCertExpiryCritical
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: SSL certificate expiring in < 7 days: {{ $labels.instance }}"
          description: "Immediate manual intervention required for {{ $labels.instance }}"

  # ── API health alerts ────────────────────────────────────────────────────────
  - name: api
    rules:
      - alert: APIHighErrorRate
        expr: rate(http_requests_total{job="bazionweb-api",status=~"5.."}[5m]) / rate(http_requests_total{job="bazionweb-api"}[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate ({{ $value | humanizePercentage }})"
          description: "API 5xx error rate is above 5% for 3 minutes. Check logs in Grafana/Loki."

      - alert: APIDown
        expr: up{job="bazionweb-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NestJS API is DOWN"
          description: "The BazionWeb API is not responding to Prometheus scrapes. Immediate investigation required."

  # ── Database alerts ──────────────────────────────────────────────────────────
  - name: database
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL is not responding. All API writes will fail."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count high ({{ $value }})"
          description: "Connection pool nearing limit (max_connections=100). Review connection pooling."

  # ── Disk alerts ──────────────────────────────────────────────────────────────
  - name: disk
    rules:
      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85% on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full. Clean up or expand disk."

      - alert: DiskSpaceCritical
        expr: (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Disk usage above 95% on {{ $labels.instance }}"
