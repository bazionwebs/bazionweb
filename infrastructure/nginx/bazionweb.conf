# ─────────────────────────────────────────────────────────────────────────────
# BazionWeb — Nginx Production Config
# Managed via Nginx Proxy Manager (docker-compose.yml)
# This file is the raw upstream config reference for manual deployments.
# ─────────────────────────────────────────────────────────────────────────────

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=quote_zone:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    server_name bazionweb.com www.bazionweb.com api.bazionweb.com
                portal.bazionweb.com admin.bazionweb.com
                cms.bazionweb.com auth.bazionweb.com
                status.bazionweb.com monitoring.bazionweb.com
                support.bazionweb.com;
    return 301 https://$host$request_uri;
}

# ── Main site (Next.js web) ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name bazionweb.com www.bazionweb.com;

    ssl_certificate     /etc/letsencrypt/live/bazionweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bazionweb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # www redirect
    if ($host = www.bazionweb.com) {
        return 301 https://bazionweb.com$request_uri;
    }

    limit_conn conn_limit 20;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Next.js static assets — aggressive caching
    location /_next/static/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check endpoint (no logging)
    location /api/health {
        access_log off;
        proxy_pass http://web:3000;
    }
}

# ── API (NestJS) ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.bazionweb.com;

    ssl_certificate     /etc/letsencrypt/live/api.bazionweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bazionweb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    limit_conn conn_limit 30;

    location /api/v1/quotes/ {
        limit_req zone=quote_zone burst=5 nodelay;
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Swagger docs — restrict to office IPs in production
    location /api/docs {
        # allow 196.X.X.X;  # Office IP
        # deny all;
        proxy_pass http://api:4000;
    }
}

# ── Keycloak (Auth) ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name auth.bazionweb.com;

    ssl_certificate     /etc/letsencrypt/live/auth.bazionweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.bazionweb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ── Uptime Kuma (Status Page) ─────────────────────────────────────────────────
# Accessible at: https://status.bazionweb.com
# WebSocket MUST be enabled — Uptime Kuma's live dashboard depends on it.
server {
    listen 443 ssl http2;
    server_name status.bazionweb.com;

    ssl_certificate     /etc/letsencrypt/live/status.bazionweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.bazionweb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Note: X-Frame-Options is intentionally omitted — Uptime Kuma embeds iframes
    # in its status page widgets. Restrict with CSP instead if needed.

    # ── Rate limiting: generous for a public status page ──
    limit_conn conn_limit 50;

    location / {
        proxy_pass         http://uptime-kuma:3001;
        proxy_http_version 1.1;

        # ── WebSocket upgrade (required for live dashboard) ──
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Long timeout for WebSocket connections
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;
    }
}

# ── Grafana (Internal Monitoring) ─────────────────────────────────────────────
# Accessible at: https://monitoring.bazionweb.com
# Restrict access by IP in production (uncomment allow/deny lines below).
server {
    listen 443 ssl http2;
    server_name monitoring.bazionweb.com;

    ssl_certificate     /etc/letsencrypt/live/monitoring.bazionweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.bazionweb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;

    limit_conn conn_limit 10;

    location / {
        # ── IP allowlist — uncomment and set your office/VPN IP ──
        # allow 196.X.X.X;   # Office
        # allow 10.0.0.0/8;  # VPN tunnel
        # deny  all;

        proxy_pass         http://grafana:3000;
        proxy_http_version 1.1;

        # WebSocket support (Grafana live updates)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

# ── Zammad (Support Ticketing) ────────────────────────────────────────────────
# Accessible at: https://support.bazionweb.com
# WebSocket MUST be enabled — Zammad's live ticket updates depend on it.
server {
    listen 443 ssl http2;
    server_name support.bazionweb.com;

    ssl_certificate     /etc/letsencrypt/live/support.bazionweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.bazionweb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn conn_limit 30;

    location / {
        proxy_pass         http://zammad-nginx:8080;
        proxy_http_version 1.1;

        # ── WebSocket upgrade (required for live session updates) ──
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Email attachments can be large
        client_max_body_size    50m;
        proxy_connect_timeout   10s;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }
}

