# ─────────────────────────────────────────────────────────────────────────────
# BazionWeb — Fail2Ban Configuration
# Aligned with: MPD v2.0, Security Requirements
# Protects: SSH, Nginx, Keycloak, and API endpoints
# ─────────────────────────────────────────────────────────────────────────────

[DEFAULT]
# Ban duration: 1 hour for first offence
bantime  = 3600
# Time window for counting failures
findtime = 600
# Max retries before ban
maxretry = 5
# Send alerts to syslog and email
action   = %(action_mwl)s
destemail = alerts@bazionweb.com
sender    = fail2ban@bazionweb.com
mta       = sendmail

# ── SSH ─────────────────────────────────────────────────────────────────────
[sshd]
enabled  = true
port     = 22
filter   = sshd
logpath  = /var/log/auth.log
maxretry = 3
bantime  = 86400   # 24 hours for SSH brute force

# ── Nginx — HTTP flood / scanning ────────────────────────────────────────────
[nginx-http-auth]
enabled  = true
filter   = nginx-http-auth
port     = http,https
logpath  = /var/log/nginx/error.log
maxretry = 5

[nginx-limit-req]
enabled  = true
filter   = nginx-limit-req
port     = http,https
logpath  = /var/log/nginx/error.log
maxretry = 10
findtime = 60
bantime  = 600

[nginx-botsearch]
enabled  = true
filter   = nginx-botsearch
port     = http,https
logpath  = /var/log/nginx/access.log
maxretry = 2
bantime  = 86400

# ── Keycloak — brute force login ─────────────────────────────────────────────
[keycloak]
enabled   = true
port      = http,https
filter    = keycloak
logpath   = /opt/keycloak/logs/keycloak.log
# Keycloak logs failed logins — pattern defined in filter
maxretry  = 5
findtime  = 300
bantime   = 3600

# ── API — rate limit enforcement ──────────────────────────────────────────────
[bazionweb-api]
enabled   = true
port      = http,https
filter    = bazionweb-api
logpath   = /var/log/nginx/access.log
# Match 429 responses from the API
maxretry  = 20
findtime  = 60
bantime   = 3600
