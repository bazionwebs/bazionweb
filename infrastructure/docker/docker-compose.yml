version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# BazionWeb — Production Docker Compose
# Aligned with: BazionWeb MPD v2.0, Section 9.2 (Infrastructure Topology)
# Host: Oracle Cloud Free Tier / Hetzner Cloud (Ubuntu 24.04 LTS)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  bazionweb-internal:
    driver: bridge
    internal: true        # No direct external access to internal services
  bazionweb-public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  strapi_uploads:
  loki_data:
  grafana_data:
  uptime_kuma_data:
  zammad_data:
  zammad_backup:
  zammad_redis_data:
  zammad_es_data:
  nginx_data:
  nginx_letsencrypt:

services:

  # ── Next.js Web App ──────────────────────────────────────────────────────────
  web:
    image: ghcr.io/bazionweb/web:${IMAGE_TAG:-latest}
    container_name: bazionweb-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.bazionweb.com/api/v1
      NEXT_PUBLIC_APP_URL: https://bazionweb.com
    networks:
      - bazionweb-public
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.bazionweb.service=web"

  # ── NestJS API ───────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/bazionweb/api:${IMAGE_TAG:-latest}
    container_name: bazionweb-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      BACKBLAZE_BUCKET: ${BACKBLAZE_BUCKET}
      BACKBLAZE_KEY_ID: ${BACKBLAZE_KEY_ID}
      BACKBLAZE_APP_KEY: ${BACKBLAZE_APP_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: noreply@bazionweb.com
      FRONTEND_URL: https://bazionweb.com
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      BANK_BENEFICIARY: ${BANK_BENEFICIARY}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER}
      BANK_IBAN: ${BANK_IBAN}
      BANK_SWIFT_BIC: ${BANK_SWIFT_BIC}
      BANK_ADDRESS_LINE: ${BANK_ADDRESS_LINE}
      BANK_ADDRESS_CITY: ${BANK_ADDRESS_CITY}
      BANK_ADDRESS_COUNTRY: ${BANK_ADDRESS_COUNTRY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bazionweb-internal
      - bazionweb-public
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bazionweb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bazionweb-internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c log_min_duration_statement=1000

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bazionweb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - bazionweb-internal
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Keycloak 23+ ─────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: bazionweb-auth
    restart: unless-stopped
    command: start --optimized
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: auth.bazionweb.com
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_FEATURES: token-exchange,admin-fine-grained-authz
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bazionweb-internal
      - bazionweb-public
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Strapi 5 CMS ─────────────────────────────────────────────────────────────
  strapi:
    image: strapi/strapi:5-alpine
    container_name: bazionweb-cms
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_SCHEMA: strapi
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      NODE_ENV: production
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bazionweb-internal
    expose:
      - "1337"

  # ── Nginx Proxy Manager ───────────────────────────────────────────────────────
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: bazionweb-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"   # NPM admin UI — firewall to IP whitelist only
    volumes:
      - nginx_data:/data
      - nginx_letsencrypt:/etc/letsencrypt
    networks:
      - bazionweb-public
      - bazionweb-internal
    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 10s
      timeout: 3s

  # ── Uptime Kuma ───────────────────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: bazionweb-uptime
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - bazionweb-internal
      - bazionweb-public
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.bazionweb.service=status"
      - "com.bazionweb.public-url=https://status.bazionweb.com"


  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: bazionweb-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitoring.bazionweb.com
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST}:${SMTP_PORT}
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - bazionweb-internal
    expose:
      - "3000"
    depends_on:
      - loki

  # ── Loki (Log Aggregation) ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: bazionweb-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./infrastructure/monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - bazionweb-internal
    expose:
      - "3100"

  # ── Zammad (Support Ticketing) ───────────────────────────────────────────────
  # Official Zammad 7 layout — one container per role. zammad-nginx:8080 is the
  # single entrypoint Nginx Proxy Manager forwards support.bazionweb.com to.
  #
  # Zammad requires PostgreSQL, Redis, Memcached and Elasticsearch — these are
  # provisioned below (dedicated instance per service, internal network only).
  # Records are stored in a dedicated `zammad_production` database created on
  # first start (POSTGRESQL_DB_CREATE), separate from the main app database.
  # ─────────────────────────────────────────────────────────────────────────────
  zammad-init:
    image: ghcr.io/zammad/zammad:${ZAMMAD_VERSION:-7.2.2-0012}
    container_name: bazionweb-support-init
    restart: on-failure
    command: ["zammad-init"]
    user: "0:0"
    environment:
      MEMCACHE_SERVERS: zammad-memcached:11211
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammad_production}
      POSTGRESQL_USER: ${DB_USER}
      POSTGRESQL_PASS: ${DB_PASSWORD}
      POSTGRESQL_OPTIONS: "?pool=50"
      POSTGRESQL_DB_CREATE: "true"
      REDIS_URL: redis://zammad-redis:6379
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      TZ: Africa/Nairobi
    depends_on:
      db:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy
    networks:
      - bazionweb-internal

  zammad-railsserver:
    image: ghcr.io/zammad/zammad:${ZAMMAD_VERSION:-7.2.2-0012}
    container_name: bazionweb-support-rails
    restart: unless-stopped
    command: ["zammad-railsserver"]
    environment:
      MEMCACHE_SERVERS: zammad-memcached:11211
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammad_production}
      POSTGRESQL_USER: ${DB_USER}
      POSTGRESQL_PASS: ${DB_PASSWORD}
      POSTGRESQL_OPTIONS: "?pool=50"
      REDIS_URL: redis://zammad-redis:6379
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      TZ: Africa/Nairobi
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    networks:
      - bazionweb-internal

  zammad-websocket:
    image: ghcr.io/zammad/zammad:${ZAMMAD_VERSION:-7.2.2-0012}
    container_name: bazionweb-support-ws
    restart: unless-stopped
    command: ["zammad-websocket"]
    environment:
      MEMCACHE_SERVERS: zammad-memcached:11211
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammad_production}
      POSTGRESQL_USER: ${DB_USER}
      POSTGRESQL_PASS: ${DB_PASSWORD}
      POSTGRESQL_OPTIONS: "?pool=50"
      REDIS_URL: redis://zammad-redis:6379
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      TZ: Africa/Nairobi
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - bazionweb-internal

  zammad-scheduler:
    image: ghcr.io/zammad/zammad:${ZAMMAD_VERSION:-7.2.2-0012}
    container_name: bazionweb-support-jobs
    restart: unless-stopped
    command: ["zammad-scheduler"]
    environment:
      MEMCACHE_SERVERS: zammad-memcached:11211
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammad_production}
      POSTGRESQL_USER: ${DB_USER}
      POSTGRESQL_PASS: ${DB_PASSWORD}
      POSTGRESQL_OPTIONS: "?pool=50"
      REDIS_URL: redis://zammad-redis:6379
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      TZ: Africa/Nairobi
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    networks:
      - bazionweb-internal

  zammad-nginx:
    image: ghcr.io/zammad/zammad:${ZAMMAD_VERSION:-7.2.2-0012}
    container_name: bazionweb-support
    restart: unless-stopped
    command: ["zammad-nginx"]
    expose:
      - "8080"
    depends_on:
      zammad-railsserver:
        condition: service_healthy
    networks:
      - bazionweb-internal
      - bazionweb-public

  zammad-memcached:
    image: memcached:1.6-alpine
    container_name: bazionweb-support-cache
    restart: unless-stopped
    command: ["memcached", "-m", "256M"]
    expose:
      - "11211"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - bazionweb-internal

  zammad-redis:
    image: redis:7-alpine
    container_name: bazionweb-support-redis
    restart: unless-stopped
    volumes:
      - zammad_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - bazionweb-internal

  zammad-elasticsearch:
    image: elasticsearch:9.5.5
    container_name: bazionweb-support-search
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - zammad_es_data:/usr/share/elasticsearch/data
    networks:
      - bazionweb-internal

  zammad-backup:
    image: ghcr.io/zammad/zammad:${ZAMMAD_VERSION:-7.2.2-0012}
    container_name: bazionweb-support-backup
    restart: unless-stopped
    command: ["zammad-backup"]
    user: "0:0"
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammad_production}
      POSTGRESQL_USER: ${DB_USER}
      POSTGRESQL_PASS: ${DB_PASSWORD}
      POSTGRESQL_OPTIONS: "?pool=50"
      REDIS_URL: redis://zammad-redis:6379
      TZ: Africa/Nairobi
      BACKUP_DIR: /var/tmp/zammad
      BACKUP_TIME: "03:00"
      BACKUP_ON_START: "false"
      HOLD_DAYS: "30"
    volumes:
      - zammad_data:/opt/zammad/storage
      - zammad_backup:/var/tmp/zammad
    depends_on:
      db:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy
    networks:
      - bazionweb-internal
